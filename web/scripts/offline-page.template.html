<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E7490">
<title>Gadit</title>
<link rel="icon" href="/favicon.ico">
<!-- Generated by scripts/build-offline-page.mjs from scripts/offline-page.template.html. Edit the template, then re-run. -->
<style>
:root{--paper:#F2F6F4;--card:#FFFFFF;--ink:#0B1220;--muted:#6B7280;--line:#DCE5E1;--teal:#0E7490;--teal-soft:#E0F2F1}
@media (prefers-color-scheme:dark){:root{--paper:#0E1513;--card:#16201D;--ink:#E8EEEB;--muted:#9AA8A3;--line:#26332F;--teal:#3CC2C2;--teal-soft:#15302E;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Rubik,Heebo,Arial,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 16px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--teal);direction:ltr}
.badge{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#D97706;display:inline-block}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus{outline:2px solid var(--teal);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:0 18px;background:var(--teal);color:#fff;cursor:pointer}
.count{font-size:13px;color:var(--muted);margin:10px 2px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;line-height:1.2;margin:0}
.tr{color:var(--muted);font-size:15px;margin-top:2px}
ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:14px}
.m{font-weight:600}
.ex{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.ex li{color:var(--muted);font-size:15px;padding-inline-start:10px;border-inline-start:3px solid var(--teal-soft)}
.opp{font-size:14px;color:var(--muted);margin-top:4px}
.sec h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
.sec p{margin:0 0 6px}
.idm{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.idm b{display:block}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--muted)}
.chip{display:inline-block;margin-top:10px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;border:0;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand">Gadit</span><span class="badge"><span class="dot"></span><span id="title"></span></span></header>
  <form id="f" autocomplete="off"><input id="q" type="search" enterkeyhint="search" autocapitalize="off" spellcheck="false"><button id="go" type="submit" aria-label="search">&#8594;</button></form>
  <div class="count" id="count"></div>
  <div id="out"></div>
</div>
<script>
(function () {
  var S = __STRINGS__;
  var RTL = { he: 1, ar: 1, fa: 1 };
  var path = location.pathname;
  var m = path.match(/^\/([a-z]{2,3}(?:-[A-Z]{2})?)(?=\/|$)/);
  var cookie = (document.cookie.match(/(?:^|; )gadit-lang=([^;]+)/) || [])[1];
  var stored = null;
  try { stored = localStorage.getItem("gadit-lang"); } catch (e) {}
  var lang = [m && m[1], cookie, stored, "en"].filter(function (l) { return l && S[l]; })[0];
  var t = S[lang];
  var dir = RTL[lang] ? "rtl" : "ltr";
  document.documentElement.lang = lang;
  document.documentElement.dir = dir;
  document.getElementById("title").textContent = t.title;
  var q = document.getElementById("q");
  q.placeholder = t.placeholder;
  q.dir = "auto";
  document.getElementById("go").innerHTML = dir === "rtl" ? "&#8592;" : "&#8594;";
  var out = document.getElementById("out");

  // Same database and store as src/lib/offline-db.ts. If the app never
  // created it, create it the same way, so the app's own code still works.
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("gadit-offline", 1);
      r.onupgradeneeded = function () {
        var db = r.result;
        if (!db.objectStoreNames.contains("words")) {
          var s = db.createObjectStore("words", { keyPath: "key" });
          s.createIndex("by_savedAt", "savedAt", { unique: false });
          s.createIndex("by_lastViewedAt", "lastViewedAt", { unique: false });
          s.createIndex("by_lang", "lang", { unique: false });
        }
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  var dbp = openDB();
  function get(key) {
    return dbp.then(function (db) {
      return new Promise(function (res) {
        var r = db.transaction("words", "readonly").objectStore("words").get(key);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }
  dbp.then(function (db) {
    var r = db.transaction("words", "readonly").objectStore("words").index("by_lang").count(IDBKeyRange.only(lang));
    r.onsuccess = function () { document.getElementById("count").textContent = t.available + " · " + r.result.toLocaleString() + " " + t.unit; };
  }).catch(function () {});

  function norm(w) { return String(w || "").normalize("NFC").replace(/[֑-ׇ]/g, "").replace(/[״“”]/g, '"').replace(/\s+/g, " ").trim().toLowerCase(); }
  // Hebrew prefixes (ו ה ב כ ל מ ש): "וכשהלכתי" also tries "כשהלכתי", "שהלכתי"...
  function candidates(w) {
    var out = [w];
    if (/^[א-ת]/.test(w)) {
      var s = w;
      for (var i = 0; i < 3 && s.length > 2 && /^[והבכלמש]/.test(s); i++) { s = s.slice(1); out.push(s); }
    }
    return out;
  }
  function lookup(word) {
    var list = candidates(norm(word));
    var langs = [lang].concat(["he", "en"].filter(function (l) { return l !== lang; }));
    var keys = [];
    list.forEach(function (w) { langs.forEach(function (l) { keys.push(l + ":" + w); }); });
    var i = 0;
    function next() {
      if (i >= keys.length) return Promise.resolve(null);
      return get(keys[i++]).then(function (hit) { return hit || next(); });
    }
    return next();
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function show(word) {
    q.value = word;
    out.innerHTML = "";
    if (!norm(word)) return;
    lookup(word).then(function (hit) {
      out.innerHTML = "";
      if (!hit || !hit.result) { out.appendChild(el("div", "msg", t.notSaved)); return; }
      var r = hit.result;
      var card = el("div", "card");
      var head = el("div");
      head.appendChild(el("h1", null, r.word || hit.word));
      if (r.translation) head.appendChild(el("div", "tr", r.translation));
      card.appendChild(head);
      if (r.suggestedWord && !(r.meanings || []).length) {
        var c = el("button", "chip", r.suggestedWord);
        c.type = "button";
        c.onclick = function () { show(r.suggestedWord); };
        card.appendChild(c);
      }
      var ms = r.meanings || [];
      if (ms.length) {
        var ol = el("ol");
        ms.forEach(function (x) {
          var li = el("li");
          li.appendChild(el("div", "m", x.meaning));
          var ex = (x.examples || []).slice(0, 3);
          if (ex.length) { var ul = el("ul", "ex"); ex.forEach(function (s) { ul.appendChild(el("li", null, s)); }); li.appendChild(ul); }
          if (x.opposite) li.appendChild(el("div", "opp", "≠ " + x.opposite));
          ol.appendChild(li);
        });
        card.appendChild(ol);
      }
      var e = r.etymology || {};
      var ety = [e.breakdown, e.originalMeaning, e.historyNote].filter(Boolean);
      if (ety.length) {
        var sec = el("div", "sec");
        sec.appendChild(el("h2", null, t.origin));
        ety.forEach(function (p) { sec.appendChild(el("p", null, p)); });
        card.appendChild(sec);
      }
      var idm = (r.generalIdioms || []).slice(0, 6);
      if (idm.length) {
        var s2 = el("div", "sec");
        s2.appendChild(el("h2", null, t.idioms));
        var ul2 = el("ul", "idm");
        idm.forEach(function (x) { var li = el("li"); li.appendChild(el("b", null, x.phrase)); li.appendChild(el("span", null, x.meaning)); ul2.appendChild(li); });
        s2.appendChild(ul2);
        card.appendChild(s2);
      }
      out.appendChild(card);
    });
  }

  document.getElementById("f").addEventListener("submit", function (ev) { ev.preventDefault(); show(q.value); q.blur(); });
  // Opened for a word page (/he/word/צחיח): show that word.
  var wm = path.match(/\/word\/([^/?#]+)/);
  if (wm) { try { show(decodeURIComponent(wm[1])); } catch (e) { show(wm[1]); } }
  else q.focus();
  // Back online: reload, and the real page loads.
  window.addEventListener("online", function () { location.reload(); });
})();
</script>
</body>
</html>
