<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" ry="112" fill="#0EA5A5"/>
  <rect width="512" height="256" rx="112" ry="112" fill="url(#gloss)" opacity="0.10"/>
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft radial glow used as the "spark" inside the G hollow.
         At small sizes (16-32 favicon) the glow blends with the G
         and reads as just a slightly brighter inner edge — so the
         icon doesn't get noisy. At large sizes (192+) it becomes
         a visible warm light hint without breaking the brand. -->
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!--
    Geometric G as a stroked path, tuned to read close to the Inter G
    that the 'Gadit' wordmark uses. The earlier version was a heavy
    industrial G; this iteration narrows the stroke slightly (64) and
    widens the opening so the proportions match the wordmark.
    Centered at translate(265, 256): the path's natural visual centre
    sits ~9 units left of origin (because the arc extends further left
    than the hook end extends right), so the translate compensates.
  -->
  <g transform="translate(265, 256)">
    <!-- Spark inside the G hollow — sits behind the strokes so the G
         glyph itself is never obscured. -->
    <circle cx="0" cy="0" r="60" fill="url(#spark)"/>
    <!-- The G itself: arc + hook -->
    <path d="M 134 -94 A 158 158 0 1 0 134 94 L 134 0 L 12 0"
          fill="none" stroke="#FFFFFF" stroke-width="64"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
