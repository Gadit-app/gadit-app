<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gadit — Screen 1 · Result Screen</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="margin:0; font-family: 'Geist', system-ui, sans-serif;">
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="result-screen.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>

  <script type="text/babel">
    // ─── Full Result Screen composition ────────────────────────────
    // `tier` drives Take it further gating + kids locked state
    // `imageState` drives the hero slot
    function ResultScreen({
      data = DATA_EN,
      tier = 'clear',
      imageState = 'empty-clear',
      mobile = false,
      script = 'latin',
      rtl = false,
    }) {
      const maxW = mobile ? 375 : 1120;
      return (
        <div dir={rtl ? 'rtl' : 'ltr'}
             data-screen-label={`01 Result · ${data.langCode} · ${mobile ? 'mobile' : 'desktop'} · ${tier}`}
             className="gd-stage" style={{ minHeight: '100%' }}>
          <div className="gd-stars" />
          <div className="relative" style={{ zIndex: 1 }}>
            {mobile ? <MobileHeader /> : <DarkHeader lang={data.language} />}

            <div style={{ maxWidth: maxW, margin: '0 auto',
                          padding: mobile ? '16px 16px 48px' : '28px 28px 72px' }}>

              <SearchBar value={data.word}
                         contextHint={!mobile}
                         rtl={rtl} />

              <div style={{ height: mobile ? 20 : 32 }} />

              {/* ─── Word header ─── */}
              <WordHeader
                word={data.word}
                language={data.language}
                langCode={data.langCode}
                pos={data.pos}
                ipa={data.ipa}
                tier={tier}
                script={script}
                mobile={mobile}
              />

              <div style={{ height: mobile ? 14 : 22 }} />

              {/* ─── AI image slot (Option C: reserved from the start) ─── */}
              <ImageSlot state={imageState} word={data.word} mobile={mobile} />

              <div style={{ height: mobile ? 22 : 34 }} />

              {/* ─── Meanings ─── */}
              <div className={`flex ${mobile ? 'flex-col gap-3' : 'flex-col gap-4'}`}>
                {!mobile && (
                  <div className="flex items-baseline justify-between" style={{ marginBottom: -4 }}>
                    <div>
                      <Eyebrow style={{ color: 'oklch(0.82 0.008 265)' }}>
                        {rtl ? `${data.meanings.length} משמעויות` : `All ${data.meanings.length} meanings`}
                      </Eyebrow>
                      <div className="font-display mt-1"
                           style={{ fontSize: 22, color: 'oklch(0.95 0.008 265)',
                                    fontStyle: 'italic', fontVariationSettings: '"opsz" 32' }}>
                        {rtl ? 'לא רק הראשונה' : 'Not just the primary one'}
                      </div>
                    </div>
                    <div className="font-sans-ui text-[12px]" style={{ color: 'oklch(0.72 0.02 265)' }}>
                      {rtl ? 'גלילה לפי סדר השימוש' : 'Ordered by common usage'}
                    </div>
                  </div>
                )}
                {data.meanings.map((m) => (
                  <MeaningCard key={m.n} {...m} script={script} mobile={mobile} />
                ))}
              </div>

              <div style={{ height: mobile ? 22 : 40 }} />

              {/* ─── Etymology ─── */}
              <EtymologyCard {...data.etymology} mobile={mobile} />

              <div style={{ height: mobile ? 14 : 22 }} />

              {/* ─── Kids ─── */}
              <KidsCard
                locked={tier === 'free'}
                intro={data.kids.intro}
                bullets={data.kids.bullets}
                script={script}
                mobile={mobile}
              />

              <div style={{ height: mobile ? 14 : 22 }} />

              {/* ─── General idioms ─── */}
              <IdiomsCard items={data.idioms} script={script} mobile={mobile} />

              <div style={{ height: mobile ? 30 : 52 }} />

              {/* ─── Take it further ─── */}
              <TakeItFurther currentTier={tier} mobile={mobile} />

              {/* ─── Footer breather ─── */}
              <div className="mt-16 pt-8 flex items-center justify-between font-sans-ui text-[11.5px]"
                   style={{ color: 'oklch(0.55 0.02 265)', borderTop: '1px solid oklch(1 0 0 / 0.05)' }}>
                <div className="flex items-center gap-2">
                  <GaditMark size={18} />
                  <span>Gadit · understand more</span>
                </div>
                <div>{rtl ? 'מצב קריאה · כהה' : 'Reading mode · dark'}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Design canvas layout ────────────────────────────────────
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="primary" title="Screen 1 — Result Screen"
                     subtitle="Desktop 1280 · Mobile 375 · RTL (Hebrew) · RTL (Arabic). Option C image slot shown in all four.">
            <DCArtboard id="desktop-clear" label="Desktop · Clear tier · image unlocked"
                        width={1280} height={3520}>
              <ResultScreen data={DATA_EN} tier="clear" imageState="empty-clear" />
            </DCArtboard>

            <DCArtboard id="desktop-free" label="Desktop · Free tier · promise-not-wall"
                        width={1280} height={3520}>
              <ResultScreen data={DATA_EN} tier="free" imageState="empty-locked" />
            </DCArtboard>

            <DCArtboard id="desktop-deep-filled" label="Desktop · Deep · image generated"
                        width={1280} height={3520}>
              <ResultScreen data={DATA_EN} tier="deep" imageState="filled" />
            </DCArtboard>

            <DCArtboard id="mobile-clear" label="Mobile 375 · Clear"
                        width={375} height={2900}>
              <ResultScreen data={DATA_EN} tier="clear" imageState="empty-clear" mobile />
            </DCArtboard>

            <DCArtboard id="mobile-free" label="Mobile 375 · Free"
                        width={375} height={2900}>
              <ResultScreen data={DATA_EN} tier="free" imageState="empty-locked" mobile />
            </DCArtboard>

            <DCArtboard id="rtl-hebrew" label="RTL · Hebrew · Clear · Rubik"
                        width={1280} height={3200}>
              <ResultScreen data={DATA_HE} tier="clear" imageState="empty-clear"
                            script="he" rtl />
            </DCArtboard>

            <DCArtboard id="rtl-arabic" label="RTL · Arabic · Clear · Noto Naskh"
                        width={1280} height={3200}>
              <ResultScreen data={DATA_AR} tier="clear" imageState="empty-clear"
                            script="ar" rtl />
            </DCArtboard>

            <DCArtboard id="mobile-rtl-hebrew" label="Mobile · RTL Hebrew · Free"
                        width={375} height={2800}>
              <ResultScreen data={DATA_HE} tier="free" imageState="empty-locked"
                            script="he" rtl mobile />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
