<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gadit — Screen 11 · Report Modal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</head>
<body style="margin:0; font-family: 'Geist', system-ui, sans-serif;">
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="report-screen.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="primary" title="Screen 11 — Report Modal"
                     subtitle="Contextual issue triage. Multi-select categories + optional textarea. Anonymous-OK.">
            <DCArtboard id="desktop-en-filled" label="Desktop · EN · 3 categories selected (canonical)"
                        width={1280} height={820}>
              <ReportModal locale="en" mobile={false} state="empty"
                           selected={['wrongEty', 'badExample', 'quizWrong']}
                           textValue="The etymology says the word came from Latin via Old French, but the example sentence shows it being used as a verb — which contradicts the noun-only definition above."
                           label="11 Report · 3 selected · EN" />
            </DCArtboard>

            <DCArtboard id="desktop-en-empty" label="Desktop · EN · Empty (submit disabled)"
                        width={1280} height={820}>
              <ReportModal locale="en" mobile={false} state="empty"
                           selected={[]} textValue=""
                           label="11 Report · Empty · EN" />
            </DCArtboard>

            <DCArtboard id="desktop-en-sent" label="Desktop · EN · Sent"
                        width={1280} height={820}>
              <ReportModal locale="en" mobile={false} state="sent"
                           label="11 Report · Sent · EN" />
            </DCArtboard>

            <DCArtboard id="mobile-en-filled" label="Mobile 375 · EN · 2 categories selected"
                        width={375} height={920}>
              <ReportModal locale="en" mobile={true} state="empty"
                           selected={['incorrectDef', 'badExample']}
                           textValue=""
                           label="11 Report · mobile EN" />
            </DCArtboard>

            <DCArtboard id="rtl-he-filled" label="RTL · Hebrew · 2 categories selected"
                        width={1280} height={820}>
              <ReportModal locale="he" mobile={false} state="empty"
                           selected={['wrongEty', 'kidsIssue']}
                           textValue="ההסבר לילדים אומר שהמילה משמשת לתיאור חלום בהקיץ, אבל הדוגמה למטה היא של חלום בשינה — לא תואם."
                           label="11 Report · 2 selected · HE" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
