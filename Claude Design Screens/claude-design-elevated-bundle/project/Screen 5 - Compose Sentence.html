<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gadit — Screen 5 · Compose Your Own Sentence</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="margin:0; font-family: 'Geist', system-ui, sans-serif;">
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="compose-screen.jsx"></script>

  <script type="text/babel">
    function App() {
      const tEN = makeT('en');
      const tHE = makeT('he');
      const tAR = makeT('ar');

      const enDraft = 'I had a strange dream last night about flying over a forest of glass.';
      const heDraft = 'אתמול בלילה היה לי חלום מוזר על מעוף מעל יער של זכוכית.';
      const arDraft = 'رأيتُ حُلمًا غريبًا الليلةَ الماضية أطير فيه فوق غابة من زجاج.';

      return (
        <DesignCanvas>
          <DCSection id="primary" title="Screen 5 — Compose Your Own Sentence"
                     subtitle="Clear+ feature · centered modal on desktop, full inline page on mobile · auto-grow modal · warm/teacherly feedback.">
            {/* canonical */}
            <DCArtboard id="desktop-en-mixed" label="Desktop · English · Mixed result (canonical)"
                        width={1280} height={1100}>
              <ComposeScene t={tEN} locale="en"
                modalProps={{ word: 'dream', state: 'mixed', draft: enDraft }} />
            </DCArtboard>
            <DCArtboard id="desktop-en-empty" label="Desktop · English · Empty"
                        width={1280} height={760}>
              <ComposeScene t={tEN} locale="en"
                modalProps={{ word: 'dream', state: 'empty' }} />
            </DCArtboard>
            <DCArtboard id="desktop-en-loading" label="Desktop · English · Loading"
                        width={1280} height={780}>
              <ComposeScene t={tEN} locale="en"
                modalProps={{ word: 'dream', state: 'loading', draft: enDraft }} />
            </DCArtboard>
            <DCArtboard id="desktop-en-success" label="Desktop · English · Success (clean)"
                        width={1280} height={950}>
              <ComposeScene t={tEN} locale="en"
                modalProps={{ word: 'dream', state: 'success', draft: 'She finally chased her dream of crossing the desert on foot.' }} />
            </DCArtboard>
            <DCArtboard id="mobile-en" label="Mobile 375 · English · Mixed"
                        width={375} height={1100}>
              <ComposeScene t={tEN} locale="en" mobile
                modalProps={{ word: 'dream', state: 'mixed', draft: enDraft }} />
            </DCArtboard>
            <DCArtboard id="rtl-he" label="RTL · Hebrew · Mixed"
                        width={1280} height={1100}>
              <ComposeScene t={tHE} locale="he" rtl
                modalProps={{ word: 'חלום', state: 'mixed', draft: heDraft }} />
            </DCArtboard>
            <DCArtboard id="rtl-ar" label="RTL · Arabic · Mixed"
                        width={1280} height={1100}>
              <ComposeScene t={tAR} locale="ar" rtl
                modalProps={{ word: 'حُلم', state: 'mixed', draft: arDraft }} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
