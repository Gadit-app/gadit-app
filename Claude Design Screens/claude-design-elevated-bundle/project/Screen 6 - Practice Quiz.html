<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gadit — Screen 6 · Practice Quiz</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="margin:0; font-family: 'Geist', system-ui, sans-serif;">
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="quiz-screen.jsx"></script>

  <script type="text/babel">
    function App() {
      const tEN = makeT('en');
      const tHE = makeT('he');
      const tAR = makeT('ar');
      const enQ = QUIZ_DATA.en.questions;
      const heQ = QUIZ_DATA.he.questions;
      const arQ = QUIZ_DATA.ar.questions;

      return (
        <DesignCanvas>
          <DCSection id="primary" title="Screen 6 — Practice Quiz"
                     subtitle="Deep-tier · 4-question quiz, mixed types A/B/C · per-answer reveal · final score screen.">
            {/* canonical: Q2/4, Type B, one option selected (pre-submit) */}
            <DCArtboard id="desktop-en-q2-selected" label="Desktop · EN · Q2/4 · Type B · selected (canonical)"
                        width={1280} height={840}>
              <QuizScene t={tEN} locale="en"
                modalProps={{ word: 'dream', qIndex: 1, total: 4,
                              question: enQ[1], selectedIdx: 1, revealed: false }} />
            </DCArtboard>
            <DCArtboard id="desktop-en-q1-revealed" label="Desktop · EN · Q1/4 · Type A · revealed (wrong + explanation)"
                        width={1280} height={1000}>
              <QuizScene t={tEN} locale="en"
                modalProps={{ word: 'dream', qIndex: 0, total: 4,
                              question: enQ[0], selectedIdx: 0, revealed: true }} />
            </DCArtboard>
            <DCArtboard id="desktop-en-q3-revealed-right" label="Desktop · EN · Q3/4 · Type C · revealed (right)"
                        width={1280} height={950}>
              <QuizScene t={tEN} locale="en"
                modalProps={{ word: 'dream', qIndex: 2, total: 4,
                              question: enQ[2], selectedIdx: 1, revealed: true }} />
            </DCArtboard>
            <DCArtboard id="desktop-en-final" label="Desktop · EN · Final score 3/4"
                        width={1280} height={780}>
              <QuizScene t={tEN} locale="en"
                modalProps={{ word: 'dream',
                              finalState: { correct: 3, total: 4,
                                missed: [{ n: 1, summary: 'Picked the aspiration sense — needed the sleep-vision one.' }] } }} />
            </DCArtboard>
            <DCArtboard id="mobile-en" label="Mobile 375 · EN · Q2/4 · Type B"
                        width={375} height={920}>
              <QuizScene t={tEN} locale="en" mobile
                modalProps={{ word: 'dream', qIndex: 1, total: 4,
                              question: enQ[1], selectedIdx: 1, revealed: false }} />
            </DCArtboard>
            <DCArtboard id="rtl-he" label="RTL · Hebrew · Type A on חלום"
                        width={1280} height={920}>
              <QuizScene t={tHE} locale="he" rtl
                modalProps={{ word: 'חלום', qIndex: 0, total: 4,
                              question: heQ[0], selectedIdx: 1, revealed: false }} />
            </DCArtboard>
            <DCArtboard id="rtl-ar" label="RTL · Arabic · Type C on حُلم"
                        width={1280} height={840}>
              <QuizScene t={tAR} locale="ar" rtl
                modalProps={{ word: 'حُلم', qIndex: 2, total: 4,
                              question: arQ[0], selectedIdx: 1, revealed: false }} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
