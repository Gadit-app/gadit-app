<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gadit — Screen 8 · Notebook + Galaxy</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="margin:0; font-family: 'Geist', system-ui, sans-serif;">
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="notebook-screen.jsx"></script>

  <script type="text/babel">
    function App() {
      const tEN = makeT('en'); const tHE = makeT('he');
      return (
        <DesignCanvas>
          <DCSection id="primary" title="Screen 8 — Notebook + Galaxy view"
                     subtitle="Deep-tier · /beta/notebook · the brand differentiator. List default + Galaxy as the wow moment.">
            <DCArtboard id="desktop-en-list" label="Desktop · EN · List view (canonical, 6 word cards)"
                        width={1280} height={1100}>
              <NotebookScreen t={tEN} locale="en" view="list" />
            </DCArtboard>
            <DCArtboard id="desktop-en-galaxy" label="Desktop · EN · Galaxy view · tooltip on ephemeral"
                        width={1280} height={960}>
              <NotebookScreen t={tEN} locale="en" view="galaxy" tooltipFor="ephemeral" />
            </DCArtboard>
            <DCArtboard id="desktop-en-empty" label="Desktop · EN · Empty state"
                        width={1280} height={780}>
              <NotebookScreen t={tEN} locale="en" empty />
            </DCArtboard>
            <DCArtboard id="mobile-en-list" label="Mobile 375 · EN · List"
                        width={375} height={1700}>
              <NotebookScreen t={tEN} locale="en" mobile view="list" />
            </DCArtboard>
            <DCArtboard id="mobile-en-galaxy" label="Mobile 375 · EN · Galaxy"
                        width={375} height={920}>
              <NotebookScreen t={tEN} locale="en" mobile view="galaxy" />
            </DCArtboard>
            <DCArtboard id="rtl-he-list" label="RTL · Hebrew · List"
                        width={1280} height={1100}>
              <NotebookScreen t={tHE} locale="he" rtl view="list" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
