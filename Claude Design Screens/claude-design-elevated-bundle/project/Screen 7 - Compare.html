<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gadit — Screen 7 · Compare Confusable Words</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>@keyframes gd-spin { to { transform: rotate(360deg); } }</style>
</head>
<body style="margin:0; font-family: 'Geist', system-ui, sans-serif;">
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="compare-screen.jsx"></script>

  <script type="text/babel">
    function App() {
      const tEN = makeT('en'); const tHE = makeT('he'); const tAR = makeT('ar');
      return (
        <DesignCanvas>
          <DCSection id="primary" title="Screen 7 — Compare Confusable Words"
                     subtitle="Deep-tier · /beta/compare · two-input form, AI comparison result with side-by-side defs, the-difference pull-quote, examples, common-mistake amber card.">
            <DCArtboard id="desktop-en-success" label="Desktop · EN · affect / effect (canonical)"
                        width={1280} height={1340}>
              <CompareScreen t={tEN} locale="en" state="success" />
            </DCArtboard>
            <DCArtboard id="desktop-en-empty" label="Desktop · EN · empty state"
                        width={1280} height={760}>
              <CompareScreen t={tEN} locale="en" state="empty" />
            </DCArtboard>
            <DCArtboard id="desktop-en-error" label="Desktop · EN · error · different_languages"
                        width={1280} height={680}>
              <CompareScreen t={tEN} locale="en" state="error:different_languages" />
            </DCArtboard>
            <DCArtboard id="mobile-en" label="Mobile 375 · EN · affect / effect"
                        width={375} height={1700}>
              <CompareScreen t={tEN} locale="en" mobile state="success" />
            </DCArtboard>
            <DCArtboard id="rtl-he" label="RTL · Hebrew · אומנות / אמנות"
                        width={1280} height={1340}>
              <CompareScreen t={tHE} locale="he" rtl state="success" />
            </DCArtboard>
            <DCArtboard id="rtl-ar" label="RTL · Arabic · ضادّ / ظاءّ"
                        width={1280} height={1340}>
              <CompareScreen t={tAR} locale="ar" rtl state="success" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
