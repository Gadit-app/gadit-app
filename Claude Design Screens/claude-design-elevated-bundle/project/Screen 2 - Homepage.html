<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gadit — Screen 2 · Homepage + Search</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="margin:0; font-family: 'Geist', system-ui, sans-serif;">
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="i18n.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="home-screen.jsx"></script>

  <script type="text/babel">
    function Homepage({ locale = 'en', mobile = false }) {
      const t = makeT(locale);
      const meta = LOCALE_META[locale];
      const rtl = meta.dir === 'rtl';
      return (
        <div dir={meta.dir}
             data-screen-label={`02 Homepage · ${locale.toUpperCase()} · ${mobile ? 'mobile' : 'desktop'}`}
             className="gd-stage" style={{ minHeight: '100%' }}>
          <div className="gd-stars" />
          <div className="relative" style={{ zIndex: 1 }}>
            {mobile ? <MobileHeader /> : <MarketingHeader locale={locale} rtl={rtl} />}
            <div style={{ paddingInline: mobile ? 16 : 28 }}>
              <HomeHero t={t} locale={locale} mobile={mobile} rtl={rtl} />
              <HomeSearch t={t} locale={locale} mobile={mobile} rtl={rtl} />
              <ResultTease t={t} locale={locale} mobile={mobile} rtl={rtl} />
              <ValueProps t={t} locale={locale} mobile={mobile} rtl={rtl} />
              <TierStrip t={t} locale={locale} mobile={mobile} rtl={rtl} />
              <HomeFooter locale={locale} rtl={rtl} mobile={mobile} />
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="primary" title="Screen 2 — Homepage + Search"
                     subtitle="Hybrid hero (search-as-CTA) · quiet-literary · 4 value props · tier strip · minimal footer.">
            <DCArtboard id="desktop-en" label="Desktop · English (canonical)"
                        width={1280} height={2700}>
              <Homepage locale="en" />
            </DCArtboard>
            <DCArtboard id="mobile-en" label="Mobile 375 · English"
                        width={375} height={2900}>
              <Homepage locale="en" mobile />
            </DCArtboard>
            <DCArtboard id="rtl-he" label="RTL · Hebrew · Rubik"
                        width={1280} height={2700}>
              <Homepage locale="he" />
            </DCArtboard>
            <DCArtboard id="rtl-ar" label="RTL · Arabic · Noto Naskh"
                        width={1280} height={2700}>
              <Homepage locale="ar" />
            </DCArtboard>
            <DCArtboard id="mobile-rtl-he" label="Mobile · RTL Hebrew"
                        width={375} height={2900}>
              <Homepage locale="he" mobile />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
